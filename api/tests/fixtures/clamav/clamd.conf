# The test suite's clamd (docker-compose.test.yml): the same detection settings as clamav/clamd.conf, but
# offline. No freshclam and no official databases: only the tiny test database in db/ (mounted read-only),
# which detects the EICAR test string (block) and a test-only PUA string (flag).
Foreground yes
LogTime yes
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
DatabaseDirectory /var/lib/clamav-test
StreamMaxLength 512M
MaxFileSize 512M
MaxScanSize 1024M
MaxRecursion 10
MaxFiles 10000
# report content past those limits (Heuristics.Limits.Exceeded.*) instead of `OK`: the scan
# records it as the archive_partially_scanned warning, not a detection (contract §5.3)
AlertExceedsMax yes
DetectPUA yes
HeuristicAlerts yes
AlertBrokenExecutables yes
AlertOLE2Macros yes
AlertEncrypted no
AlertPhishingSSLMismatch no
AlertPhishingCloak no

#:schema node_modules/wrangler/config-schema.json
# files.gg edge Worker: files.gg pages (the new viewer and dashboard from web/dist), cdn.files.gg
# bytes (B2, with a GCS fallback), the api.files.gg passthrough and proxy.files.gg. See README.md.
#
# Build order: `npm run build` in ../web first (it writes ../web/dist), then deploy this Worker.
name = "files-gg"
main = "worker/index.js"
compatibility_date = "2026-11-23"

# Only the zone routes below serve traffic; no *.workers.dev copy of the CDN or API.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "files.gg/*", zone_name = "files.gg" },
  { pattern = "cdn.files.gg/*", zone_name = "files.gg" },
  { pattern = "api.files.gg/*", zone_name = "files.gg" },
  { pattern = "proxy.files.gg/*", zone_name = "files.gg" },
]

# web/dist as Workers static assets. The Worker always runs first: it decides which host may see
# which file (cdn.files.gg and api.files.gg never serve app files), sets cache headers and renders
# viewer.html. Nothing is served by path on its own, so /viewer.html and /app.html stay internal.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[vars]
# The public hostnames the Worker routes on and writes into its CSPs and URLs. Unset, they are
# today's hosts (below), so production needs nothing here. Bare hostnames only; e2e/ sets them to
# files.localhost etc. for wrangler dev. The routes above must match them on a real deployment.
# MAIN_HOST = "files.gg"          # also answers on www.<MAIN_HOST>
# CDN_HOST = "cdn.files.gg"
# API_HOST = "api.files.gg"       # also the default API origin when API_ORIGIN is unset
# PROXY_HOST = "proxy.files.gg"

# Comma-separated origins allowed credentialed CORS on API_HOST and MAIN_HOST/api/*. Empty: the
# MAIN_HOST origin.
CORS_ALLOWED_ORIGINS = "https://files.gg"

# B2 (S3-compatible) for cdn.files.gg reads, e.g. S3_ENDPOINT = "https://s3.us-west-004.backblazeb2.com".
# Until all three are set (plus the two read-key secrets below), the CDN reads from GCS only.
S3_ENDPOINT = ""
S3_REGION = ""
S3_BUCKET_FILES = ""

# Objects missing from B2 are retried on the old GCS bucket while blobs are being migrated.
# Set to "false" once every blob is in B2 (PLAN.md "Moving off GCS", step 5).
STORAGE_GCS_FALLBACK = "true"

# Secrets are never stored here. Set each one once per Worker with `npx wrangler secret put <NAME>`:
#
#   ORIGIN_SHARED_SECRET       Must equal the API's. Sent as X-Filesgg-Origin-Secret on every API
#                              request and on the internal lookups. Unset: pages say "unavailable".
#   CDN_TOKEN_SECRET           Must equal the API's. Verifies ?t= access tokens for password and
#                              private files. Unset: protected files can't be opened on the CDN.
#   S3_READ_ACCESS_KEY_ID      B2 application key id with readFiles only, scoped to the files bucket.
#   S3_READ_SECRET_ACCESS_KEY  Its secret.
#   PROXY_SECRET               Callers of proxy.files.gg send it as X-Proxy-Token. Unset: 403.
#
# Generate shared secrets with `openssl rand -hex 32`. For `npm run dev`, put local values in
# .dev.vars (git-ignored).

#:schema node_modules/wrangler/config-schema.json
# files.gg edge Worker: files.gg pages (the viewer and dashboard from web/dist), cdn.files.gg (files,
# previews, album collages and ZIPs from B2), the api.files.gg passthrough, and customers' custom
# domains (Cloudflare for SaaS, Worker as origin). See README.md.
#
# Build order: `npm run build` in ../web first (it writes ../web/dist), then deploy this Worker.
name = "files-gg"
main = "worker/index.js"
compatibility_date = "2026-11-23"

# Only the zone routes below serve traffic; no *.workers.dev copy of the CDN or API.
workers_dev = false
preview_urls = false

# `*/*` sends every other hostname on the zone to the Worker, which is how Cloudflare for SaaS
# custom hostnames reach it (docs/redesign/contracts/milestone-6.md §17, "Worker as your fallback
# origin"). The specific routes above it win for our own hosts. Any other hostname on the zone that
# must not reach the Worker (mail, status...) needs its own route with no Worker.
routes = [
  { pattern = "files.gg/*", zone_name = "files.gg" },
  { pattern = "cdn.files.gg/*", zone_name = "files.gg" },
  { pattern = "api.files.gg/*", zone_name = "files.gg" },
  { pattern = "*/*", zone_name = "files.gg" },
]

# web/dist as Workers static assets. The Worker always runs first: it decides which host may see
# which file (cdn.files.gg and api.files.gg never serve app files), sets cache headers and renders
# viewer.html. Nothing is served by path on its own, so /viewer.html and /app.html stay internal.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[vars]
# The public hostnames the Worker routes on and writes into its CSPs and URLs. Unset, they are
# today's hosts (below), so production needs nothing here. Bare hostnames only; e2e/ sets them to
# files.localhost etc. for wrangler dev. The routes above must match them on a real deployment.
# MAIN_HOST = "files.gg"          # also answers on www.<MAIN_HOST>
# CDN_HOST = "cdn.files.gg"
# API_HOST = "api.files.gg"       # also the default API origin when API_ORIGIN is unset

# The web session cookie the Worker forwards on MAIN_HOST/api/* (and nowhere else). Unset, it is
# the production name, __Host-filesgg_session; the plain-http local stack (e2e/) sets
# "filesgg_session", matching the API's SESSION_COOKIE_INSECURE. Must equal the API's name.
# SESSION_COOKIE_NAME = "__Host-filesgg_session"
#
# CORS is never credentialed: every cross-origin caller gets `*` (CORS_ALLOWED_ORIGINS is gone;
# delete it from deployed Workers).

# B2 (S3-compatible), the only storage cdn.files.gg reads, e.g.
# S3_ENDPOINT = "https://s3.us-west-004.backblazeb2.com". Until all three are set (plus the two
# read-key secrets below), the CDN answers 503 for every file, preview and ZIP. `wrangler deploy`
# re-applies these on every deploy, so ops/deploy.sh passes the real ones from the server's .env
# (`--var S3_ENDPOINT:...`, the same bucket as the API's); a bare `wrangler deploy` empties them.
S3_ENDPOINT = ""
S3_REGION = ""
S3_BUCKET_FILES = ""

# Where adult content isn't served (docs/redesign/contracts/milestone-7.md §11): comma-separated
# ISO country codes, checked against Cloudflare's `request.cf.country`. NSFW files, previews, albums,
# collages and ZIPs answer 451 there. Empty means GB. ops/deploy.sh passes the server's .env value
# (`--var ADULT_BLOCKED_COUNTRIES:...`, the same one the API gets) when it's set; otherwise this one.
ADULT_BLOCKED_COUNTRIES = "GB"

# Secrets are never stored here. Set each one once per Worker with `npx wrangler secret put <NAME>`:
#
#   ORIGIN_SHARED_SECRET       Must equal the API's. Sent as X-Filesgg-Origin-Secret on every API
#                              request and on the internal lookups. Unset: pages say "unavailable".
#   CDN_SIGNING_SECRET         Must equal the API's. Verifies signed CDN URLs (expires & sig) for
#                              password and private files and albums, and staff URLs (staff=, at
#                              most 10 minutes). The Worker never signs.
#                              Unset: protected targets can't be opened on the CDN (401/404).
#   S3_READ_ACCESS_KEY_ID      B2 application key id with readFiles only, scoped to the files bucket.
#   S3_READ_SECRET_ACCESS_KEY  Its secret.
#
# Generate shared secrets with `openssl rand -hex 32`. For `npm run dev`, put local values in
# .dev.vars (git-ignored).

# --- The staging run (docs/redesign/LAUNCH.md §7) -------------------------------------------------
# `wrangler deploy --env staging` (ops/deploy.sh with WORKER_ENV=staging in the staging .env): the
# Worker `files-gg-staging`, on the three staging host names only (no `*/*`, the production Worker
# keeps everything else). vars and routes aren't inherited from the top level, so they're all here;
# the S3 values come from the staging .env like production's. Its secrets are its own:
# `npx wrangler secret put <NAME> --env staging`. Deleted with the staging Worker after the run (§7.8).
[env.staging]
name = "files-gg-staging"
routes = [
  { pattern = "staging.files.gg/*", zone_name = "files.gg" },
  { pattern = "cdn-staging.files.gg/*", zone_name = "files.gg" },
  { pattern = "api-staging.files.gg/*", zone_name = "files.gg" },
]

[env.staging.vars]
MAIN_HOST = "staging.files.gg"
CDN_HOST = "cdn-staging.files.gg"
API_HOST = "api-staging.files.gg"
S3_ENDPOINT = ""
S3_REGION = ""
S3_BUCKET_FILES = ""
ADULT_BLOCKED_COUNTRIES = "GB"

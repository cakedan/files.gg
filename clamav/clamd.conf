# clamd for files.gg (docs/redesign/contracts/milestone-4.md §5.2), mounted read-only into the `clamav`
# service of docker-compose.yml. Signatures are ClamAV's official databases only (the image's own freshclam);
# YARA rules from clamav/rules/ are linked into the database directory at start and loaded by clamd itself.
# Only the scanner and rescanner reach it (TCP 3310, never published).
LogTime yes
LogFile /var/log/clamav/clamd.log
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
DatabaseDirectory /var/lib/clamav
# reload updated databases
SelfCheck 600
# the job process streams blobs with zINSTREAM; anything over CLAMAV_MAX_BYTES (512 MiB) isn't sent
StreamMaxLength 512M
MaxFileSize 512M
MaxScanSize 1024M
MaxRecursion 10
MaxFiles 10000
# report content past those limits (Heuristics.Limits.Exceeded.*) instead of `OK`: the scan
# records it as the archive_partially_scanned warning, not a detection (contract §5.3)
AlertExceedsMax yes
DetectPUA yes
HeuristicAlerts yes
AlertBrokenExecutables yes
AlertOLE2Macros yes
# encrypted archives are handled by the scan's own archive checks (§5.3)
AlertEncrypted no
AlertPhishingSSLMismatch no
AlertPhishingCloak no

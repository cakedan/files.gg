# API test suite against a real Postgres 19 (the same image as docker-compose.yml), MinIO for B2 (with an
# Object Lock evidence bucket) and clamd (the contract's ClamAV image) with a tiny test-only signature database.
# The test image is the worker's environment (Python 3.14, the media and scanning tools, the NSFW model).
# Turnstile's siteverify, PhotoDNA and Web Risk are mocked or stood in, so the suite runs offline. One live test against
# Cloudflare's testing keys runs only with FILESGG_NETWORK_TESTS=1 (it needs internet).
# From the repo root:
#
#   docker compose -f docker-compose.test.yml up --build --attach tests --exit-code-from tests
#
# Add `-p <name>` to run it next to another stack (e.g. the local e2e stack) without touching it.
#
# The command's exit code is pytest's. To pass pytest arguments, e.g. one file:
#
#   docker compose -f docker-compose.test.yml run --rm --build tests python -m pytest tests/test_jobs.py -v
#
# Clean up afterwards with: docker compose -f docker-compose.test.yml down
name: filesgg-api-tests

services:
  postgres:
    image: postgres:19.0@sha256:aaa10f7ba7328b4a221a6c3184d83eef885bd16bf1f6de864757863156b0a4d1
    environment:
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off"]
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

  # stands in for Backblaze B2 (S3-compatible); tests never touch real B2 (contract §3).
  # MinIO no longer publishes images to Docker Hub; Chainguard's build, 2026.11.24, pinned by digest
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:9f0aab4471ebb181be3cfabea21b719303ec583cd9abdb7779f9e53032b844f7
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: filesgg-test
      MINIO_ROOT_PASSWORD: filesgg-test-secret
    tmpfs:
      - /data:mode=1777

  # milestone-4 §5.2: the same image as docker-compose.yml, but offline: no freshclam and no official databases.
  # clamd loads only api/tests/fixtures/clamav/db (EICAR by hash, and a test-only PUA string), mounted read-only.
  clamav:
    image: clamav/clamav:1.5.5-debian@sha256:85f35b3eee903dbd96c5ca250c5aa13d230d97987c0f876f7d46f001f9414239
    command: ["clamd", "--foreground", "--config-file=/etc/clamav/clamd-test.conf"]
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - ./api/tests/fixtures/clamav/clamd.conf:/etc/clamav/clamd-test.conf:ro
      - ./api/tests/fixtures/clamav/db:/var/lib/clamav-test:ro
    healthcheck:
      test: ["CMD", "clamdscan", "--config-file=/etc/clamav/clamd-test.conf", "--ping", "1"]
      interval: 2s
      timeout: 5s
      retries: 60

  # milestone-5 §3.1, §14: a real Redis (RQ forks its work horses, which fakeredis can't follow), the same image as
  # docker-compose.yml, in memory only
  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    command: ["redis-server", "--requirepass", "filesgg-test-redis", "--appendonly", "no", "--save", ""]
    environment:
      REDISCLI_AUTH: filesgg-test-redis
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  # milestone-5 §3.2: LibreOffice in its own container with no network at all, as in docker-compose.yml, fed through
  # the tmpfs spool the tests share. Before the daemon starts, the command writes what network the container has to
  # /spool/network.txt (the interfaces that are up, its routes, and what connecting out gives) for test_office.py;
  # the rest is the real service's configuration.
  office:
    build:
      context: ./api
      target: office
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    environment:
      OFFICE_PROCESSES: "2"
    volumes:
      - office-spool:/spool
    command:
      - python3
      - -c
      - |
        import os, socket
        up = []
        for name in sorted(os.listdir('/sys/class/net')):
            try:
                with open('/sys/class/net/{}/flags'.format(name)) as handle:
                    if int(handle.read(), 16) & 0x1:
                        up.append(name)
            except (OSError, ValueError):
                pass
        with open('/proc/net/route') as handle:
            routes = len(handle.read().splitlines()) - 1
        lines = ['up=' + ','.join(up), 'routes={}'.format(routes)]
        try:
            socket.create_connection(('1.1.1.1', 80), 3).close()
            lines.append('connect=ok')
        except OSError as error:
            lines.append('connect=' + type(error).__name__)
        with open('/spool/network.txt', 'w') as handle:
            handle.write('\n'.join(lines) + '\n')
        os.execvp('python3', ['python3', '/office/daemon.py'])
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, sys; sys.exit(0 if os.path.isdir('/spool/done') else 1)"]
      interval: 1s
      timeout: 3s
      retries: 60

  tests:
    build:
      context: ./api
      target: test
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_healthy
      redis:
        condition: service_healthy
      office:
        condition: service_healthy
    environment:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@postgres:5432/postgres
      VIEW_HASH_SECRET: test-view-hash-secret
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET_FILES: filesgg-test
      S3_ACCESS_KEY_ID: filesgg-test
      S3_SECRET_ACCESS_KEY: filesgg-test-secret
      # the contract's test-vector secret (milestone-3 §3)
      CDN_SIGNING_SECRET: test-cdn-signing-secret
      # Cloudflare's documented testing secret that always passes (used only by the opt-in live test)
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
      # milestone-4: clamd above; the matcher, the evidence bucket and the test keys are set by tests/conftest.py
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      # milestone-5 §3.1: the RQ queues and the rate limits
      REDIS_URL: redis://:filesgg-test-redis@redis:6379/0
      # milestone-5 §3.2: the office service's spool
      OFFICE_SPOOL_DIR: /spool
    volumes:
      - office-spool:/spool

volumes:
  # milestone-5 §3.2: tmpfs, shared by the tests (the converter's side) and office only
  office-spool:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m,uid=10001,mode=0770

# Secrets come from the shell or an untracked .env file next to this file; compose refuses to
# start if a required one is missing (the API also refuses to boot without them).
#   POSTGRES_PASSWORD, SECRET_KEY, RPC_KEY, ORIGIN_SHARED_SECRET, VIEW_HASH_SECRET,
#   DB_BACKUP_RESTIC_PASSWORD, S3_BACKUP_ACCESS_KEY_ID, S3_BACKUP_SECRET_ACCESS_KEY,
#   POSTMARK_SERVER_TOKEN, CDN_SIGNING_SECRET, TURNSTILE_SECRET,
#   S3_ENDPOINT, S3_REGION, S3_BUCKET_FILES, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
#   (Milestone 4) CSAM_MATCHER, PHOTODNA_SUBSCRIPTION_KEY (scanner and rescanner only), ABUSE_HASH_SECRET, EVIDENCE_PUBLIC_KEY,
#   S3_BUCKET_EVIDENCE, S3_EVIDENCE_ACCESS_KEY_ID, S3_EVIDENCE_SECRET_ACCESS_KEY (WEB_RISK_API_KEY is optional)
#
# Order on `docker compose up`: postgres becomes healthy, migrate runs once and must succeed,
# then api and worker start. Scale either independently, e.g. `docker compose up --scale worker=2`;
# scheduled tasks still run once (advisory locks), and every process leases its own Snowflake
# node id.
#
# Postgres runs here in Docker, next to files.gg, the same way as notsobot.api (docs/redesign/PLAN.md §2.1 item 8):
# Postgres 19.0 pinned by digest, published on localhost only, data in ./.data/postgres, and daily encrypted restic
# backups to Backblaze by backup-db, scheduled by scheduler-ofelia (backup/README.md).

x-api-environment: &api-environment
  # Defaults to the postgres service below; override to point at another host (e.g. over a
  # private network when the API runs on several servers).
  DATABASE_URL: ${DATABASE_URL:-postgresql://filesgg:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/filesgg}
  # account email through Postmark (api/utils/email.py). Send from the mail.files.gg subdomain with SPF, DKIM
  # and DMARC set up in Postmark; receiving (abuse@, support@) is Cloudflare Email Routing, not this.
  POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:?POSTMARK_SERVER_TOKEN must be set (Postmark server API token)}
  EMAIL_FROM: ${EMAIL_FROM:-files.gg <noreply@mail.files.gg>}
  RPC_KEY: ${RPC_KEY:?RPC_KEY must be set}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://files.gg}
  # The public site and CDN origins written into file URLs, #pw=/#t= links, owner passes and email links
  # (api/utils/urls.py). Change them only for another deployment (staging, or the local stack in e2e/).
  PUBLIC_URL: ${PUBLIC_URL:-https://files.gg}
  CDN_URL: ${CDN_URL:-https://cdn.files.gg}
  # Comma-separated hostnames a Turnstile token must have been issued for (siteverify's `hostname`).
  TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-files.gg}
  # Shared with the Cloudflare Worker (its ORIGIN_SHARED_SECRET binding). The API trusts the
  # forwarded client IP only when this matches; without it every per-IP limit sees nginx/Cloudflare.
  ORIGIN_SHARED_SECRET: ${ORIGIN_SHARED_SECRET:?ORIGIN_SHARED_SECRET must be set (openssl rand -hex 32)}
  # Keys the daily rotating HMAC for unique-view counting (no IPs are stored). Same value on every API server.
  VIEW_HASH_SECRET: ${VIEW_HASH_SECRET:?VIEW_HASH_SECRET must be set (openssl rand -hex 32)}
  # Signs CDN URLs for password and private files and albums (milestone-3 §3); the Worker's CDN_SIGNING_SECRET
  # secret must be the same value. The API's own unlock tokens are signed with SECRET_KEY.
  CDN_SIGNING_SECRET: ${CDN_SIGNING_SECRET:?CDN_SIGNING_SECRET must be set (openssl rand -hex 32, shared with the Worker)}
  # Cloudflare Turnstile secret key (contract §8); the site key goes in web/ config.
  TURNSTILE_SECRET: ${TURNSTILE_SECRET:?TURNSTILE_SECRET must be set (Cloudflare Turnstile secret key)}
  # The files bucket on B2 (S3-compatible API), with the API's write/delete application key (contract §3).
  # The CDN Worker reads with its own read-only key.
  S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT must be set (the B2 US region endpoint, e.g. s3.<region>.backblazeb2.com)}
  S3_REGION: ${S3_REGION:?S3_REGION must be set (the B2 region, e.g. us-west-004)}
  S3_BUCKET_FILES: ${S3_BUCKET_FILES:?S3_BUCKET_FILES must be set (the private files bucket)}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set (B2 key with writeFiles and deleteFiles)}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
  # Milestone 4 (docs/redesign/contracts/milestone-4.md §13). The API validates the matcher choice at boot
  # (`standin` refuses to run without FILESGG_DEV_TOOLS=1, so production can't run without a real matcher).
  CSAM_MATCHER: ${CSAM_MATCHER:?CSAM_MATCHER must be set (photodna; standin is for tests and local development)}
  # The stable keyed IP hash for bans, rate limits and distinct reporters (milestone-4 §1). Rotating it makes every
  # existing ban and IP hash useless.
  ABUSE_HASH_SECRET: ${ABUSE_HASH_SECRET:?ABUSE_HASH_SECRET must be set (openssl rand -hex 32)}
  # libsodium public key (base64) the raw uploader IP is sealed to; the private key stays offline (milestone-4 §3.6)
  EVIDENCE_PUBLIC_KEY: ${EVIDENCE_PUBLIC_KEY:?EVIDENCE_PUBLIC_KEY must be set (the evidence key pair's public key, base64)}
  NSFW_THRESHOLD: ${NSFW_THRESHOLD:-0.85}

# Only the scanner and rescanner get the matcher, ClamAV, Web Risk and evidence settings (milestone-4 §13).
x-scanner-environment: &scanner-environment
  <<: *api-environment
  # only the matcher's callers hold the key (the API never does); they refuse to start without it with
  # CSAM_MATCHER=photodna (api/safety/settings.py check_scanner)
  PHOTODNA_SUBSCRIPTION_KEY: ${PHOTODNA_SUBSCRIPTION_KEY:-}
  PHOTODNA_MATCH_URL: ${PHOTODNA_MATCH_URL:-https://api.microsoftmoderator.com/photodna/v1.0/Match}
  PHOTODNA_TIMEOUT: ${PHOTODNA_TIMEOUT:-10}
  PHOTODNA_MAX_RPS: ${PHOTODNA_MAX_RPS:-5}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  WEB_RISK_API_KEY: ${WEB_RISK_API_KEY:-}
  # The evidence bucket on B2, with Object Lock (compliance mode), and a key that can write and copy into it (and
  # read the files bucket, the copy's source) but not read or delete evidence (milestone-4 §3.6, §15).
  S3_BUCKET_EVIDENCE: ${S3_BUCKET_EVIDENCE:?S3_BUCKET_EVIDENCE must be set (the Object Lock evidence bucket)}
  S3_EVIDENCE_ACCESS_KEY_ID: ${S3_EVIDENCE_ACCESS_KEY_ID:?S3_EVIDENCE_ACCESS_KEY_ID must be set}
  S3_EVIDENCE_SECRET_ACCESS_KEY: ${S3_EVIDENCE_SECRET_ACCESS_KEY:?S3_EVIDENCE_SECRET_ACCESS_KEY must be set}
  EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-365}

x-api-service: &api-service
  build:
    context: ./api/
    target: runtime
  image: filesgg-api:latest
  environment: *api-environment
  # come back after a crash or a reboot (migrate overrides this with "no")
  restart: unless-stopped
  # the processes run as uid 10001 and need no Linux capabilities; the media and scan children inherit this
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    # 2026.11.24, PostgreSQL 19 (latest major, released 2026-11-19, supported to 2031-11). backup/Dockerfile uses the
    # same image so pg_dump matches the server. notsobot.api is on 18.7; files.gg starts on 19 to avoid a major upgrade later
    image: postgres:19.0@sha256:aaa10f7ba7328b4a221a6c3184d83eef885bd16bf1f6de864757863156b0a4d1
    restart: always
    command: -c config_file=/etc/postgres/postgresql.conf
    environment:
      POSTGRES_DB: filesgg
      POSTGRES_USER: filesgg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      # only published on localhost by default (docker bypasses ufw), as in notsobot.api. set POSTGRES_BIND to a
      # private-network address when API servers on other machines need it, and firewall it some other way
      - ${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432
    volumes:
      # 18+ keeps its data in a versioned folder under /var/lib/postgresql (19/docker), so the mount is the parent
      - ./.data/postgres:/var/lib/postgresql
      - ./postgres/postgres.conf:/etc/postgres/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # backup/: daily encrypted backups of postgres into a restic repository on backblaze (US), restic encrypts before
  # uploading. same setup as notsobot.api's backup-db. restore steps in backup/README.md
  backup-db:
    build:
      context: ./backup/
    image: filesgg-backup-db
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RESTIC_REPOSITORY: s3:${S3_ENDPOINT:?set S3_ENDPOINT in .env (the B2 US region endpoint, e.g. s3.<region>.backblazeb2.com)}/${S3_BUCKET_DB_BACKUP:-filesgg-db-backups}/restic
      # without it the backups can't be decrypted, keep a copy somewhere other than this server
      RESTIC_PASSWORD: ${DB_BACKUP_RESTIC_PASSWORD:?set DB_BACKUP_RESTIC_PASSWORD in .env}
      RESTIC_CACHE_DIR: /cache
      # a backup-only B2 application key, separate from the one the API uses for files
      AWS_ACCESS_KEY_ID: ${S3_BACKUP_ACCESS_KEY_ID:?set S3_BACKUP_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_BACKUP_SECRET_ACCESS_KEY:?set S3_BACKUP_SECRET_ACCESS_KEY in .env}
      DB_BACKUP_HEALTHCHECK_URL: ${DB_BACKUP_HEALTHCHECK_URL:-}
      # empty falls back to backup.sh's defaults (14 daily, unlimited weekly, 0 monthly, 0 yearly)
      DB_BACKUP_KEEP_DAILY: ${DB_BACKUP_KEEP_DAILY:-}
      DB_BACKUP_KEEP_WEEKLY: ${DB_BACKUP_KEEP_WEEKLY:-}
      DB_BACKUP_KEEP_MONTHLY: ${DB_BACKUP_KEEP_MONTHLY:-}
      DB_BACKUP_KEEP_YEARLY: ${DB_BACKUP_KEEP_YEARLY:-}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: filesgg
      PG_USER: filesgg
      PG_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ./.cache/restic:/cache
      - ./.restore:/restore
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.db-backup-daily.schedule: "0 0 2 * * *" # 02:00:00 every day
      ofelia.job-exec.db-backup-daily.command: "backup all"
      ofelia.job-exec.db-backup-daily.no-overlap: "true"
      ofelia.job-exec.db-backup-check.schedule: "0 0 5 * * 0" # 05:00:00 every sunday
      ofelia.job-exec.db-backup-check.command: "backup check"
      ofelia.job-exec.db-backup-check.no-overlap: "true"

  # runs backup-db's jobs from its labels, as in notsobot.api. it needs the docker socket (read-only) to exec them
  scheduler-ofelia:
    # 2026.11.15
    image: mcuadros/ofelia:0.3.23@sha256:75c3a3d7ddeb99bc1545a4955155019f0444f6e6d6f812f4e3304bfae8e67304
    restart: unless-stopped
    depends_on:
      - backup-db
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # One-off: applies pending SQL migrations, then exits. Never create tables on boot.
  migrate:
    <<: *api-service
    command: ["python", "-m", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - 8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Background jobs (uploads finalising, media processing) and the scheduler; scans run in `scanner` below. Its own image
  # target (api/Dockerfile `worker`) adds ffmpeg and poppler-utils; the API image has neither.
  # `default` carries finalize_upload and delete_blob, `media` probe / derive / album_collage
  # (milestone-3 §2); a dedicated media worker can be split out later with WORKER_QUEUES=media.
  worker:
    <<: *api-service
    build:
      context: ./api/
      target: worker
    image: filesgg-worker:latest
    environment:
      <<: *api-environment
      WORKER_QUEUES: default,media
    command: ["python", "-m", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Milestone 4 (§2.2): a new hash's `scan` never waits behind a slow derive or a rescan backlog, so the scan and
  # rescan queues get their own services from the worker image (Python 3.14, the scanning tools, the NSFW model).
  scanner:
    <<: *api-service
    build:
      context: ./api/
      target: worker
    image: filesgg-worker:latest
    environment:
      <<: *scanner-environment
      WORKER_QUEUES: scan
    command: ["python", "-m", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  rescanner:
    <<: *api-service
    build:
      context: ./api/
      target: worker
    image: filesgg-worker:latest
    environment:
      <<: *scanner-environment
      WORKER_QUEUES: rescan
    command: ["python", "-m", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  # ClamAV (milestone-4 §5.2): official signatures only, through the image's own freshclam; YARA rules from
  # clamav/rules/ are linked into the database directory at start and loaded by clamd itself. Never published:
  # only the scanner and rescanner reach it. The `-debian` tags are multi-arch (the plain ones are amd64 only).
  clamav:
    image: clamav/clamav:1.5.5-debian@sha256:85f35b3eee903dbd96c5ca250c5aa13d230d97987c0f876f7d46f001f9414239   # digest as of 2026-11-23
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "for rule in /var/lib/clamav-rules/*.yar /var/lib/clamav-rules/*.yara; do [ -e \"$$rule\" ] && ln -sf \"$$rule\" /var/lib/clamav/; done; exec /init"]
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - ./.data/clamav:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./clamav/rules:/var/lib/clamav-rules:ro
    expose: ["3310"]
    healthcheck: { test: ["CMD", "clamdcheck.sh"], interval: 60s, timeout: 10s, retries: 3, start_period: 6m }
    mem_limit: 4g

  nginx:
    # 2026.11.24, nginx mainline 1.31 (latest), pinned by digest
    image: nginx:1.31@sha256:6a3df739b6312289e87d70947d900669c1b3087474ece5814b9c01bbf2e6dde3
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certificates:/certificates:ro
    ports:
      - 80:80
      - 443:443

# Local full stack for the end-to-end test (e2e/README.md): Postgres 19, MinIO standing in for B2
# (the files bucket and the Object Lock evidence bucket), the migrations, the API, `python -m worker`,
# the Milestone 4 `scanner` and `rescanner`, an offline clamd, and (Milestone 6) a mock of Cloudflare's
# custom hostnames API for custom domains. The Cloudflare Worker runs on the
# host under `wrangler dev` (started by e2e/up.sh) and reaches the API and MinIO on the loopback ports
# below.
#
# Don't run this file by hand: e2e/up.sh generates the secrets in e2e/.local/.env and passes it
# with --env-file. Data lives in Docker named volumes only (this repo may sit in a synced folder);
# e2e/down.sh removes them. The bind mounts are ClamAV's test configuration and signature database
# from api/tests/fixtures/clamav, read-only, and the mock Cloudflare script from e2e/scripts.
name: filesgg-e2e

x-api-environment: &api-environment
  DATABASE_URL: postgresql://filesgg:${POSTGRES_PASSWORD:?run e2e/up.sh}@postgres:5432/filesgg
  SECRET_KEY: ${SECRET_KEY:?run e2e/up.sh}
  RPC_KEY: ${RPC_KEY:?run e2e/up.sh}
  ORIGIN_SHARED_SECRET: ${ORIGIN_SHARED_SECRET:?run e2e/up.sh}
  VIEW_HASH_SECRET: ${VIEW_HASH_SECRET:?run e2e/up.sh}
  CDN_SIGNING_SECRET: ${CDN_SIGNING_SECRET:?run e2e/up.sh}
  # Cloudflare's documented always-pass Turnstile testing secret: siteverify is the real one (the
  # stack needs internet), and only the testing site key's dummy token passes it.
  TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
  TURNSTILE_HOSTNAMES: files.localhost
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET_FILES: filesgg
  S3_ACCESS_KEY_ID: filesgg-e2e
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run e2e/up.sh}
  # The local public hostnames (served by wrangler dev on the host). *.localhost resolves to loopback.
  PUBLIC_URL: http://files.localhost:${E2E_PORT:-8787}
  CDN_URL: http://cdn.files.localhost:${E2E_PORT:-8787}
  LOG_LEVEL: INFO
  # Milestone 4 (docs/redesign/contracts/milestone-4.md §13). The stand-in CSAM matcher (benign test
  # hashes from api/tests/fixtures/standin) only runs with FILESGG_DEV_TOOLS=1; the API refuses to
  # boot without a matcher, ABUSE_HASH_SECRET and EVIDENCE_PUBLIC_KEY.
  CSAM_MATCHER: standin
  FILESGG_DEV_TOOLS: "1"
  ABUSE_HASH_SECRET: ${ABUSE_HASH_SECRET:?run e2e/up.sh}
  # X25519 (libsodium) public key the uploader IP is sealed to; up.sh keeps the private half in
  # e2e/.local/evidence-private.pem
  EVIDENCE_PUBLIC_KEY: ${EVIDENCE_PUBLIC_KEY:?run e2e/up.sh}
  # Milestone 6 (docs/redesign/contracts/milestone-6.md §3.2, §15). The session cookie is
  # `filesgg_session` without `Secure` over plain http: only with FILESGG_DEV_TOOLS=1 (production refuses
  # to boot with it). There's no ALLOWED_ORIGINS any more: the website calls files.localhost/api
  # same-origin, and nothing is credentialed cross-origin.
  SESSION_COOKIE_INSECURE: "1"
  # ShareX's RequestURL and the curl snippet of a new upload key (§7.7)
  API_PUBLIC_URL: http://api.files.localhost:${E2E_PORT:-8787}
  # Custom domains (§10): the `cloudflare` mock below stands in for Cloudflare's custom hostnames API, and
  # DOMAIN_DNS_STUB=1 (dev only, with FILESGG_DEV_TOOLS=1) treats the CNAME and TXT records as present,
  # since *.localhost test hostnames have no real DNS. The worker gets these too (domain_checker and
  # domain_delete run there).
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?run e2e/up.sh}
  CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:?run e2e/up.sh}
  CLOUDFLARE_API_BASE: http://cloudflare:8080/client/v4
  DOMAIN_DNS_STUB: "1"
  # Milestone 5 (docs/redesign/contracts/milestone-5.md §3.1): the RQ queues and the rate limits, on the redis
  # service below (REDIS_PASSWORD is hex, generated by up.sh)
  REDIS_URL: redis://:${REDIS_PASSWORD:?run e2e/up.sh}@redis:6379/0
  # Rate limits (§18): a whole e2e run comes from one IP, so the global, upload and conversion limits are raised;
  # the brute-force scopes of §18.3 (register, login, ...) keep their defaults, which e2e/run.mjs checks on purpose.
  RATE_LIMITS: '{"global":"1000 per second","guest":"1000 per minute","file_upload":"1000 per minute","chunked_upload":"1000 per minute","conversions":"1000 per minute"}'
  # Discord stays off (DISCORD_* unset): the API answers 503 DISCORD_UNAVAILABLE and /auth/config says false.

# Only the scanner and rescanner get ClamAV and the evidence bucket (milestone-4 §13). Web Risk is
# unset, so it's `skipped` (it fails open, §2.6).
x-scanner-environment: &scanner-environment
  <<: *api-environment
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  # The evidence bucket (Object Lock, created by the `bucket` one-off). MinIO has one key locally; in
  # production the evidence key can write and copy into it but not read or delete.
  S3_BUCKET_EVIDENCE: filesgg-evidence
  S3_EVIDENCE_ACCESS_KEY_ID: filesgg-e2e
  S3_EVIDENCE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run e2e/up.sh}

x-api-service: &api-service
  build:
    context: ../api
    target: runtime
  image: filesgg-api:e2e
  environment: *api-environment

# Milestone 5 (docs/redesign/contracts/milestone-5.md §3.1): the converter services, as in docker-compose.yml with one
# process each, sharing the office spool.
x-converter-service: &converter-service
  <<: *api-service
  build:
    context: ../api
    target: converter
  image: filesgg-converter:e2e
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /convert-tmp:size=2g,uid=10001,mode=0700
  volumes:
    - office-spool:/spool
  environment:
    <<: *api-environment
    RQ_REDIS_URL: redis://:${REDIS_PASSWORD:?run e2e/up.sh}@redis:6379/0
    CONVERT_TMP_DIR: /convert-tmp
    CONVERT_PROCESSES: "1"
    OFFICE_SPOOL_DIR: /spool
  depends_on:
    migrate:
      condition: service_completed_successfully
    bucket:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    office:
      condition: service_healthy

services:
  postgres:
    # the same image as docker-compose.yml
    image: postgres:19.0@sha256:aaa10f7ba7328b4a221a6c3184d83eef885bd16bf1f6de864757863156b0a4d1
    environment:
      POSTGRES_DB: filesgg
      POSTGRES_USER: filesgg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run e2e/up.sh}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filesgg -d filesgg"]
      interval: 1s
      timeout: 3s
      retries: 60

  # Milestone 5 (§3.1): the same image and settings as docker-compose.yml, data in a named volume, never published
  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?run e2e/up.sh}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?run e2e/up.sh}
    volumes:
      - redis-data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 60

  # stands in for Backblaze B2; the same image as docker-compose.test.yml
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:9f0aab4471ebb181be3cfabea21b719303ec583cd9abdb7779f9e53032b844f7
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: filesgg-e2e
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run e2e/up.sh}
    volumes:
      - minio-data:/data
    ports:
      # the Worker (wrangler dev, on the host) reads the bucket with SigV4 here
      - 127.0.0.1:${E2E_MINIO_PORT:-19000}:9000

  # One-off: creates the files bucket and the evidence bucket, the latter with Object Lock (which
  # can only be turned on at creation; milestone-4 §3.6). boto3 is already in the API image. Retries
  # while MinIO starts.
  bucket:
    <<: *api-service
    restart: "no"
    depends_on:
      - minio
    environment:
      <<: *scanner-environment
    command:
      - python
      - -c
      - |
        import os, time, boto3
        from botocore.config import Config
        s3 = boto3.client('s3', endpoint_url=os.environ['S3_ENDPOINT'], region_name=os.environ['S3_REGION'],
                          aws_access_key_id=os.environ['S3_ACCESS_KEY_ID'],
                          aws_secret_access_key=os.environ['S3_SECRET_ACCESS_KEY'],
                          config=Config(s3={'addressing_style': 'path'}))
        files, evidence = os.environ['S3_BUCKET_FILES'], os.environ['S3_BUCKET_EVIDENCE']
        for attempt in range(60):
            try:
                existing = [b['Name'] for b in s3.list_buckets().get('Buckets', [])]
                break
            except Exception as error:
                print('waiting for minio:', type(error).__name__)
                time.sleep(1)
        else:
            raise SystemExit('minio never came up')
        if files not in existing:
            s3.create_bucket(Bucket=files)
        if evidence not in existing:
            s3.create_bucket(Bucket=evidence, ObjectLockEnabledForBucket=True)
        lock = s3.get_object_lock_configuration(Bucket=evidence)['ObjectLockConfiguration']
        if lock.get('ObjectLockEnabled') != 'Enabled':
            raise SystemExit('the evidence bucket {} has no Object Lock; run e2e/down.sh'.format(evidence))
        print('buckets ready:', files, 'and', evidence, '(Object Lock enabled)')

  # One-off: applies the migrations, then exits.
  migrate:
    <<: *api-service
    restart: "no"
    command: ["python", "-m", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # Stands in for Cloudflare's custom hostnames API (e2e/scripts/mock_cloudflare.py, standard library only,
  # run with the API image's Python). In memory: e2e/down.sh forgets everything. Published on loopback so
  # e2e/run.mjs can see what the API asked for (GET /_mock/hostnames).
  cloudflare:
    <<: *api-service
    restart: "no"
    command: ["python", "/mock/mock_cloudflare.py"]
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?run e2e/up.sh}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:?run e2e/up.sh}
      PORT: "8080"
    volumes:
      - ./scripts/mock_cloudflare.py:/mock/mock_cloudflare.py:ro
    ports:
      - 127.0.0.1:${E2E_CLOUDFLARE_PORT:-18081}:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 1s
      timeout: 3s
      retries: 60

  api:
    <<: *api-service
    command: ["sanic", "app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080", "--workers", "2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      cloudflare:
        condition: service_healthy
    ports:
      # API_ORIGIN for wrangler dev; browsers and the test go through the Worker instead
      - 127.0.0.1:${E2E_API_PORT:-18080}:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Background jobs (finalising chunked uploads; probe, derive and album collages on the `media`
  # queue) and the scheduled tasks (the expiry and album reapers, and Milestone 4's sweeper, rescan
  # scheduler and report closer). The `worker` target is the API image plus ffmpeg, poppler and the
  # scanning tools, on Python 3.14 (api/Dockerfile).
  worker:
    <<: *api-service
    build:
      context: ../api
      target: worker
    image: filesgg-worker:e2e
    command: ["python", "-m", "worker"]
    environment:
      <<: *api-environment
      WORKER_POLL_INTERVAL: "0.5"
      WORKER_QUEUES: default,media
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Milestone 4 (§2.2): new uploads stay `pending` until `scan` runs here: blocked hashes, the
  # stand-in CSAM matcher, PDQ, the NSFW model, ClamAV, and the archive, Office and PDF checks.
  scanner:
    <<: *api-service
    build:
      context: ../api
      target: worker
    image: filesgg-worker:e2e
    command: ["python", "-m", "worker"]
    environment:
      <<: *scanner-environment
      WORKER_POLL_INTERVAL: "0.5"
      WORKER_QUEUES: scan
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  # Rescans (§2.7): a malware report's immediate ClamAV rescan, and the scheduled ones.
  rescanner:
    <<: *api-service
    build:
      context: ../api
      target: worker
    image: filesgg-worker:e2e
    command: ["python", "-m", "worker"]
    environment:
      <<: *scanner-environment
      WORKER_POLL_INTERVAL: "0.5"
      WORKER_QUEUES: rescan
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  # ClamAV (§5.2): the same image as docker-compose.yml and docker-compose.test.yml, but offline like
  # the test compose: no freshclam and no official databases, only the test-only signature database
  # (EICAR by hash, and a test PUA string), mounted read-only. Never published.
  clamav:
    image: clamav/clamav:1.5.5-debian@sha256:85f35b3eee903dbd96c5ca250c5aa13d230d97987c0f876f7d46f001f9414239
    command: ["clamd", "--foreground", "--config-file=/etc/clamav/clamd-test.conf"]
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - ../api/tests/fixtures/clamav/clamd.conf:/etc/clamav/clamd-test.conf:ro
      - ../api/tests/fixtures/clamav/db:/var/lib/clamav-test:ro
    healthcheck:
      test: ["CMD", "clamdscan", "--config-file=/etc/clamav/clamd-test.conf", "--ping", "1"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Milestone 5 (§3.1): converter-premium takes convert_premium then convert_member, converter convert_member then
  # convert_anonymous, converter-previews the document previews.
  converter-premium:
    <<: *converter-service
    command: ["rq", "worker-pool", "convert_premium", "convert_member", "-n", "1", "--worker-class",
              "convert_worker.ConvertWorker"]
    cpu_shares: 768

  converter:
    <<: *converter-service
    command: ["rq", "worker-pool", "convert_member", "convert_anonymous", "-n", "1", "--worker-class",
              "convert_worker.ConvertWorker"]
    cpu_shares: 512

  converter-previews:
    <<: *converter-service
    command: ["rq", "worker-pool", "convert_previews", "-n", "1", "--worker-class", "convert_worker.ConvertWorker"]
    cpu_shares: 256

  # Milestone 5 (§3.2): LibreOffice with no network at all, as in docker-compose.yml
  office:
    build:
      context: ../api
      target: office
    image: filesgg-office:e2e
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    environment:
      OFFICE_PROCESSES: "1"
    volumes:
      - office-spool:/spool
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, sys; sys.exit(0 if os.path.isdir('/spool/done') else 1)"]
      interval: 1s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
  minio-data:
  redis-data:
  # §3.2: the converter <-> office spool, in memory
  office-spool:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1g,uid=10001,mode=0770

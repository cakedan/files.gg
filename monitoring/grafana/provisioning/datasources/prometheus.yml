# The Prometheus datasource (monitoring/prometheus/prometheus.yml), on the compose network. The dashboard and the alert
# rules refer to it by its uid.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

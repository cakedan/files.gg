# Prometheus for files.gg (contract milestone-7 §4), on the compose network: nothing here is published, Grafana and an
# SSH tunnel are the only way in (monitoring/README.md). docker-compose.yml's `prometheus` service mounts this directory
# at /etc/prometheus and keeps 15 days (--storage.tsdb.retention.time).
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # files.gg's own metrics (api/utils/metrics.py): the counters every API and worker process keeps in Redis, rendered
  # by any API container (they all read the same hash). /internal/* answers only the Worker's lookups: the origin
  # secret and the lookup header (api/views/internal.py), so Prometheus sends both. The secret is ORIGIN_SHARED_SECRET,
  # given to the container as the compose secret `origin_shared_secret`; it never appears in this file.
  - job_name: filesgg
    metrics_path: /internal/metrics
    http_headers:
      X-Filesgg-Origin-Secret:
        files: [/run/secrets/origin_shared_secret]
      X-Filesgg-Internal-Lookup:
        values: ['1']
    static_configs:
      - targets: ['api:8080']

  # the host: CPU, memory, disks
  - job_name: node
    static_configs:
      - targets: ['exporter-node:9100']

  - job_name: postgres
    static_configs:
      - targets: ['exporter-postgres:9187']

  - job_name: redis
    static_configs:
      - targets: ['exporter-redis:9121']

  # every container's CPU, memory and restarts
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

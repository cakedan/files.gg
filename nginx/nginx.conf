events {}

http {
    server_tokens off;

    # reuse connections to Sanic instead of opening one per request
    upstream api_upstream {
        server api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        return 502;
    }
    server {
        listen 80;
        #listen 443 ssl;
        #ssl_certificate /certificates/certificate.cert;
        #ssl_certificate_key /certificates/certificate.key;
        server_name api.files.gg;
        charset utf-8;
        client_max_body_size 100M;

        # Optional: only accept connections from Cloudflare. Copy the current ranges from
        # https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6 and keep them
        # updated (they change); a stale list blocks real traffic. Example shape only:
        #
        #   allow <cloudflare-ipv4-range>;   # one line per range from ips-v4
        #   allow <cloudflare-ipv6-range>;   # one line per range from ips-v6
        #   deny all;
        #
        # Client IPs do not depend on this: the API trusts X-Filesgg-Client-Ip only when
        # X-Filesgg-Origin-Secret matches ORIGIN_SHARED_SECRET (the worker sets both).

        location / {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Overwrite, never append: a client cannot inject earlier hops. The API (PROXIES_COUNT=1)
            # reads this as the client IP when the request did not come through the worker.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # X-Filesgg-Origin-Secret and X-Filesgg-Client-Ip from the worker pass through unchanged
            # (nginx forwards request headers by default); the API checks the secret.
        }
    }
}

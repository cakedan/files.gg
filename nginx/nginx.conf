# The origin (docs/redesign/contracts/milestone-7.md §2.2). Only Cloudflare reaches it: the firewall lets 443 in from
# Cloudflare's ranges only, and TLS itself refuses a client without Cloudflare's Authenticated Origin Pulls
# certificate. Everything that reaches it is the Worker's: its api.files.gg passthrough, its lookups under
# /internal/, and custom domains through the fallback origin, origin.files.gg.
#
# Mounted as a directory at /etc/nginx/filesgg (docker-compose.yml), so `git pull` is seen; ops/deploy.sh checks it
# with `nginx -t` and reloads. Certificates, in nginx/certificates/:
#   certificate.cert, certificate.key      the Cloudflare origin certificate for files.gg and *.files.gg (never
#                                          committed: put on the server by hand, docs/redesign/LAUNCH.md)
#   cloudflare-origin-pull-ca.pem          Cloudflare's public origin-pull CA (zone-level Authenticated Origin Pulls,
#                                          developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem,
#                                          valid to 2029-11-01)

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    charset utf-8;
    default_type application/octet-stream;

    # Docker's DNS. `api` is the compose service: during a deploy it answers with both API containers (the old one
    # and the new one, ops/deploy.sh), so both get requests until the old one is gone. ops/deploy.sh waits longer than
    # `valid` (and the upstream's fail_timeout) between the new container being ready and stopping the old one.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    # The Worker's lookup secret, `$filesgg_worker_lookup` (templates/internal-lookup.conf.template, rendered at start by
    # the image's envsubst step, like templates/server-names.conf.template);
    # its key is the 64-character secret and more, over the default bucket size
    map_hash_bucket_size 128;
    include /etc/nginx/conf.d/internal-lookup.conf;

    # During a deploy the old container refuses connections from its SIGTERM on (api/app.py stops accepting at once,
    # while in-flight requests finish): a refused connection goes to the other container (proxy_next_upstream, a
    # request never sent is retried whatever its method) and takes the old one out for fail_timeout (the default
    # max_fails=1, fail_timeout=10s, shared by the workers through the zone). So once it has exited, its address,
    # which answers nothing until nginx's next DNS lookup forgets it, isn't picked; if it is (nothing reached it while
    # it drained), the 250 ms connect timeout below takes it out the same way. No keepalive: an idle connection the
    # old container closes just as nginx reuses it would fail an upload (a POST is never retried), and a new
    # connection on the Docker network costs next to nothing.
    upstream api_upstream {
        zone api_upstream 64k;
        server api:8080 resolve;
    }

    ssl_certificate /etc/nginx/filesgg/certificates/certificate.cert;
    ssl_certificate_key /etc/nginx/filesgg/certificates/certificate.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    # Authenticated Origin Pulls: no Cloudflare client certificate, no TLS (the handshake fails)
    ssl_client_certificate /etc/nginx/filesgg/certificates/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    # PROXY_BODY_LIMIT_BYTES (104857600, 100 MiB, Cloudflare's own limit for the zone) plus 1 MiB of multipart
    # framing. Change both together: ops/check-env.sh refuses a deploy when they disagree.
    client_max_body_size 101M;

    # The API answers within Cloudflare's 100 s origin timeout; a 100 MB single upload is hashed and stored on B2
    # before the answer.
    # a connection on the Docker network takes well under a millisecond; one that doesn't is to a container that's gone
    proxy_connect_timeout 250ms;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    # A request already sent is retried only when it's idempotent (nginx's default), so an upload is never sent twice.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 3;

    # Any other host name: TLS with the same checks, then 421
    server {
        listen 443 ssl default_server;
        http2 on;
        return 421;
    }

    # api.files.gg, origin.files.gg (the Cloudflare for SaaS fallback origin custom domains reach, milestone-6 §17), and
    # the staging run's API host when NGINX_EXTRA_API_HOSTS names it (templates/server-names.conf.template)
    server {
        listen 443 ssl;
        http2 on;
        include /etc/nginx/conf.d/server-names.conf;

        # The Worker's own lookups (cf-worker/worker/domains/internal.js): exactly these paths, with its
        # ORIGIN_SHARED_SECRET and `X-Filesgg-Internal-Lookup: 1`. Anything else under /internal (/internal/metrics
        # is Prometheus', on the compose network) is the API's own 404, however it's spelled: nginx matches the
        # decoded, normalised path, case-insensitively.
        location ~ ^/internal/(files|albums|domains)/[^/]+$ {
            if ($filesgg_worker_lookup != 1) {
                return 404 '{"code":"NOT_FOUND","message":"Not found","status":404}';
            }
            proxy_pass http://api_upstream;
            include /etc/nginx/filesgg/proxy.conf;
        }
        location ~* ^/internal(/|$) {
            return 404 '{"code":"NOT_FOUND","message":"Not found","status":404}';
        }

        location / {
            proxy_pass http://api_upstream;
            include /etc/nginx/filesgg/proxy.conf;
        }

        # the 404 bodies above are JSON, like the API's
        default_type application/json;
    }

    # Docker's health check only (docker-compose.yml), never published
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /healthz {
            return 204;
        }
        location / {
            return 404;
        }
    }
}

# Included by every `proxy_pass` to the API in nginx.conf.
proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwrite, never append: a client cannot inject earlier hops. The API (PROXIES_COUNT=1) reads this as the client IP
# when the request didn't come through the Worker; behind Cloudflare it's a Cloudflare address, so the API trusts
# X-Filesgg-Client-Ip instead, only with X-Filesgg-Origin-Secret matching ORIGIN_SHARED_SECRET (the Worker sets both,
# and nginx passes them through unchanged).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

listen_addresses = '*'

# Mounted by the postgres service in docker-compose.yml (same layout as notsobot.api's postgres/postgres.conf).
# Sized for one API host to start; raise with the server and see PgBouncer in docs/redesign/PLAN.md §2.1 item 5.

# each Sanic worker keeps a small pool (DATABASE_POOL_MAX, default 10), plus the worker, migrate and backup-db
max_connections = 200

# kills a session left idle inside a transaction (a hung or stuck client) so its row locks don't block everyone else.
# uploads stream to storage outside transactions, so this can be short
idle_in_transaction_session_timeout = '2min'

# a runaway query is cancelled instead of holding connections; the API sets tighter per-query limits where needed
statement_timeout = '5min'

# logs anything slow enough to look at
log_min_duration_statement = '1s'

# tune these to the host when deploying (pgtune-style), e.g. for 16 GB RAM / SSD:
#shared_buffers = 4GB
#effective_cache_size = 12GB
#maintenance_work_mem = 1GB
#work_mem = 8MB
#random_page_cost = 1.1
#effective_io_concurrency = 200

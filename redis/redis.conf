# files.gg's Redis (docs/redesign/contracts/milestone-5.md §3.1): the RQ queues of the converter services and the
# rate-limit windows (§18). The same settings as notsobot.api's db-api-redis.
#
# The append-only file means a crash loses at most a second of queued jobs instead of everything since the last
# snapshot, and the conversion sweeper (convert_sweep, §3.3) re-enqueues any `queued` conversion whose job is gone.
# Redis' default RDB snapshots stay on too. Nothing here needs a backup: every conversion is a Postgres row.
appendonly yes
appendfsync everysec
